$scrPath = $HOME/.config/hypr/lib

gesture = 3, horizontal, workspace

exec-once = fcitx5 > /dev/null 2>&1 &
exec-once = thunar --daemon > /dev/null 2>&1 &
exec-once = awww-daemon > /dev/null 2>&1 &
exec-once = waypaper --restore > /dev/null 2>&1 &
# exec-once = [workspace 2 silent] ghostty
# exec-once = [workspace 1 silent] zen-beta
# exec-once = hyprpm reload -n

bind = Control Alt, W , exec, pkill -x waybar || waybar &
bind = Super, a, exec, $scrPath/wallpaper.sh
bind = Super, space, exec, pkill -x rofi || rofi -show drun -replace -i -config ~/.config/rofi/config.rasi
bind = Super, V, exec, pkill -x rofi || $scrPath/cliphist.sh -c
bind = Super, comma, exec, pkill -x rofi || $scrPath/emoji-picker.sh
bind = Super, period, exec, pkill -x rofi || $scrPath/glyph-picker.sh
bind = Super Alt, G, exec, $scrPath/gamemode.sh # Disable Hyprland effects for gamemode
bind = Super Shift, P, exec, hyprpicker -an # Pick color (Hex) to clipboard
bind = Super, P, exec, $scrPath/screenshot.sh s # Partial screenshot capture
bind = Super Control, P, exec, $scrPath/screenshot.sh sf # partial screenshot capture (frozen screen)
# bindl = Super Alt, P, exec, $scrPath/screenshot.sh m # monitor screenshot capture
bindl = Super Alt, P, exec, $scrPath/screenshot.sh sc # ocr screen capture
bindl = , Print, exec, $scrPath/screenshot.sh p # all monitors screenshot capture
bind = Super+Alt, q , exec, hyprctl dispatch dpms toggle
bind = Super+Shift, q , exec, systemctl suspend

windowrule = noinitialfocus, class:^(com.follow.clash)$
